# Ataru Tmux config
set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -g status-keys vi

#disable status bar
set -g status off

# use C-f for the prefix.
unbind C-b
set-option -g prefix C-f

#vim, vifm, fzf control - inside

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

is_fzf="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

is_vifm="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?vifm$'"

bind -n C-h run "($is_vim && tmux send-keys C-h) || \
                         ($is_vifm && tmux send-keys C-h) || \
                         tmux select-pane -L"

bind -n C-j run "($is_vim && tmux send-keys C-j)  || \
                         ($is_vifm && tmux send-keys C-j) || \
                         ($is_fzf && tmux send-keys C-j) || \
                         tmux select-pane -D"

bind -n C-k run "($is_vim && tmux send-keys C-k) || \
                         ($is_vifm && tmux send-keys C-k) || \
                         ($is_fzf && tmux send-keys C-k)  || \
                         tmux select-pane -U"

bind -n C-l run  "($is_vim && tmux send-keys C-l) || \
                         ($is_vifm && tmux send-keys C-l) || \
                         tmux select-pane -R"

# create new window for vifm, next/previous with Ctrl, Alt for moving left/rigth
bind -n M-a new-window -t VifmSession vifm
bind -n M-n next-window
bind -n M-p previous-window
bind-key -n C-M-n swap-window -t -1
bind-key -n C-M-p swap-window -t +1

# bind-key -n C-\if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
# not work

# Set easier window split keys
# bind-key v split-window -h
# bind-key h split-window -v

# Synchronize panes
bind-key y set-window-option synchronize-panes\; display-message "synchronize mode toggled."

# Easy config reload
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."

# Easy clear history
bind-key L clear-history

# Key bindings for copy-paste
setw -g mode-keys vi
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Mouse Mode
set -g mouse on

# Lengthen the amount of time status messages are displayed
set-option -g display-time 3000
set-option -g display-panes-time 3000

# Set the base-index to 1 rather than 0
set -g base-index 1
set-window-option -g pane-base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Allow the arrow key to be used immediately after changing windows.
set-option -g repeat-time 0

# No delay for escape key press
set -sg escape-time 0

# Change background color of a tab when activity occurs
setw -g monitor-activity on

# Do NOT reset the color of the tab after activity stops occuring
setw -g monitor-silence 0

# Disable bell
setw -g monitor-bell off

# Disable visual text box when activity occurs
set -g visual-activity off

set -g focus-events on


