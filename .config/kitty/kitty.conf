# include colors.conf
include ~/.local/share/tinted-theming/tinty/tinted-terminal-themes-kitty-file.conf

# Font
font_family      SFMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Font spacing
modify_font cell_width 95%

# Window
window_padding_width 5
remember_window_size no
initial_window_width  92c
initial_window_height 24c

# Cursor
cursor_shape block
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 16384
scrollbar never

# Bell
enable_audio_bell no
window_alert_on_bell yes

# Mouse
mouse_hide_wait 3.0
url_style single
open_url_with firefox

# Copy and paste
# map ctrl+shift+c copy_to_clipboard
# map ctrl+shift+v paste_from_clipboard
# map ctrl+alt+v paste_from_clipboard
# map ctrl+alt+c copy_selection_or_last_command_output

# Copy and paste
map --allow-fallback=shifted,ascii ctrl+shift+c copy_to_clipboard
map --allow-fallback=shifted,ascii ctrl+shift+v paste_from_clipboard

map --allow-fallback=shifted,ascii ctrl+alt+v paste_from_clipboard
map --allow-fallback=shifted,ascii ctrl+alt+c copy_selection_or_last_command_output


# Keyboard selection of arbitrary visible text
# map alt+e kitten hints --type=word --program @

# Select and open visible URLs
map alt+u kitten hints --type=url

# Font resizing
map ctrl+minus change_font_size all -1.0
map ctrl+equal change_font_size all +1.0
map ctrl+plus change_font_size all 0

# Neovim 0.12 scrollback pager with ANSI colors
scrollback_pager env NVIM_APPNAME=kitty-scrollback nvim --cmd 'set eventignore=FileType' +'call nvim_open_term(0, {})' +'set nomodified nolist' -
# map alt+e show_scrollback

# Normal Kitty: open Kitty scrollback
map alt+e show_scrollback

# When Kitty's foreground process is tmux:
# do not run Kitty scrollback; pass Alt+e to tmux instead
map --when-focus-on cmdline:tmux alt+e send_key alt+e

confirm_os_window_close 0
paste_actions no-op

# # Select one visible word and copy it
# map alt+e kitten hints --type=word --program @

# # Select one complete visible line and copy it
# map alt+l kitten hints --type=line --program @

# # Select multiple complete lines and copy them joined by newlines
# map alt+shift+l kitten hints --type=line --multiple --multiple-joiner newline --program @

# # Select an IP address and copy it
# map alt+i kitten hints --type=ip --program @

# # Select a visible path and copy it
# map alt+p kitten hints --type=path --program @
